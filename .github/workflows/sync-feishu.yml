name: Publish complete COOC courses from Feishu Wiki

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-feishu-courses
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate complete public course site
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_PUBLIC_ROOT_TOKEN: ${{ secrets.FEISHU_WIKI_PUBLIC_ROOT_TOKEN }}
        run: python scripts/sync_feishu_wiki.py
      - name: Verify static publication mapping
        run: python -m unittest discover -s tests -v
      - name: Commit generated public course site when changed
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add site
          git diff --cached --quiet || git commit -m 'chore: sync public course site'
          git push

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
